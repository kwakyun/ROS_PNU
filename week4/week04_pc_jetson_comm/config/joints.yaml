joint_names:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

servo_id:
  shoulder_pan: 1
  shoulder_lift: 2
  elbow_flex: 3
  wrist_flex: 4
  wrist_roll: 5
  gripper: 6

sign:
  shoulder_pan: 1
  shoulder_lift: 1
  elbow_flex: 1
  wrist_flex: 1
  wrist_roll: 1
  gripper: 1

zero_offset_rad:
  shoulder_pan: 0.0
  shoulder_lift: 0.0
  elbow_flex: 0.0
  wrist_flex: 0.0
  wrist_roll: 0.0
  gripper: 0.0

device: /dev/ttyACM0
baudrate: 1000000
# Requested timer rate; actual throughput also depends on serial reads.
publish_hz: 50.0

feetech:
  model: STS3215
  ticks_per_rev: 4096
  center_tick: 2048
