joint_names:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

servo_id:
  shoulder_pan: 1
  shoulder_lift: 2
  elbow_flex: 3
  wrist_flex: 4
  wrist_roll: 5
  gripper: 6

sign:
  shoulder_pan: 1
  shoulder_lift: 1
  elbow_flex: 1
  wrist_flex: 1
  wrist_roll: 1
  gripper: 1

zero_offset_rad:
  shoulder_pan: 0.0
  shoulder_lift: 0.0
  elbow_flex: 0.0
  wrist_flex: 0.0
  wrist_roll: 0.0
  gripper: 0.0

limit_rad:
  shoulder_pan: [-1.91986, 1.91986]
  shoulder_lift: [-1.74533, 1.74533]
  elbow_flex: [-1.69, 1.69]
  wrist_flex: [-1.65806, 1.65806]
  wrist_roll: [-2.74385, 2.84121]
  gripper: [-0.174533, 1.74533]

max_vel_rad_s:
  shoulder_pan: 1.0
  shoulder_lift: 1.0
  elbow_flex: 1.0
  wrist_flex: 1.5
  wrist_roll: 2.0
  gripper: 2.0

device: /dev/ttyACM0
baudrate: 1000000
publish_hz: 50.0
control_hz: 100.0
# /joint_targets가 끊기면 이 시간 후 마지막 명령 위치를 hold한다.
command_timeout_ms: 300
# hold 상태에서 같은 목표를 서보에 다시 기록하는 주기다.
heartbeat_hz: 10.0

feetech:
  model: STS3215
  ticks_per_rev: 4096
  center_tick: 2048


pose_range_limit:
  X_LIMIT: [0.05, 0.35]
  Y_LIMIT: [-0.20, 0.20]
  Z_LIMIT: [0.00, 0.10]
  PITCH_LIMIT: [0.30, 1.50]
  RADIUS_LIMIT: [0.145, 0.42]

pose_speed_limit:
  DEADZONE: 0.05
  SPEED_X: 0.075
  SPEED_Y: 0.075
  SPEED_Z: 0.060
  SPEED_PITCH: 0.90